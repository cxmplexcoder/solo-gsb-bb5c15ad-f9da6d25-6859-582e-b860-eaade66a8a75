services:
  adjudicator:
    build: .
    image: rule-adjudicator:latest
    container_name: rule-adjudicator
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # In-container bind settings.
      HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      # Cap on union combinations generated by batch-data-plans (422 beyond).
      MAX_BATCH_PLAN_COMBINATIONS: "${MAX_BATCH_PLAN_COMBINATIONS:-100000}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); sys.exit(0 if json.load(r).get('status')=='ok' else 1)"]
      interval: 15s
      timeout: 3s
      start_period: 25s
      retries: 3
